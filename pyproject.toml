[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-agent"
version = "0.1.0"
description = "Agent that trains, releases and monitors outboxml models from Russian prompts"
requires-python = ">=3.12"
dependencies = [
    "outboxml==1.0.1",
    "pydantic==2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "PyHamcrest",
    "pandas-stubs",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["ml_agent", "ml_agent.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D100",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["outboxml.*", "joblib.*"]
ignore_missing_imports = true
